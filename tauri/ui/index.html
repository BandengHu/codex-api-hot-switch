<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codex SwitchGate</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb;
    --panel: rgba(255, 255, 255, .86);
    --fg: #1a2233;
    --muted: #697386;
    --line: rgba(39, 55, 90, .12);
    --brand: #315efb;
    --brand-soft: rgba(49, 94, 251, .12);
    --ok: #22a06b;
    --ok-soft: rgba(34, 160, 107, .14);
    --err: #d64545;
    --err-soft: rgba(214, 69, 69, .1);
    --err-line: rgba(214, 69, 69, .34);
    --shadow: 0 24px 70px rgba(25, 45, 90, .1);
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111521;
      --panel: rgba(25, 31, 46, .88);
      --fg: #edf1fa;
      --muted: #9aa6bb;
      --line: rgba(184, 199, 230, .14);
      --brand: #7f9cff;
      --brand-soft: rgba(127, 156, 255, .14);
      --ok: #52d39b;
      --ok-soft: rgba(82, 211, 155, .16);
      --err: #ff8a84;
      --err-soft: rgba(255, 138, 132, .1);
      --err-line: rgba(255, 138, 132, .36);
      --shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 36px 24px;
    overflow: hidden;
    color: var(--fg);
    background: var(--bg);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .stage {
    width: min(100%, 620px);
    text-align: center;
  }
  .welcome {
    animation: rise .5s cubic-bezier(.2, .75, .25, 1) both;
  }
  .mark {
    position: relative;
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 14px;
    background: var(--brand-soft);
  }
  .mark svg {
    position: relative;
    z-index: 1;
    width: 32px;
    height: 32px;
    color: var(--brand);
  }
  h1 {
    margin: 0;
    font-size: 36px;
    line-height: 1.16;
    letter-spacing: 0;
    font-weight: 650;
  }
  .tagline {
    margin: 12px auto 0;
    max-width: 440px;
    color: var(--muted);
    font-size: 15px;
  }
  .status {
    min-height: 22px;
    margin-top: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
    font-size: 14px;
  }
  .spinner {
    width: 17px;
    height: 17px;
    flex: none;
    border: 2px solid var(--line);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin .85s linear infinite;
  }
  .status[data-state="ready"] .spinner {
    border: 0;
    animation: none;
    background: var(--ok);
    box-shadow: 0 0 0 5px var(--ok-soft);
  }
  .error {
    width: min(100%, 680px);
    padding: 28px;
    text-align: left;
    border: 1px solid var(--err-line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--shadow);
    animation: rise .35s cubic-bezier(.2, .75, .25, 1) both;
  }
  .error[hidden], .welcome[hidden] { display: none; }
  .error-icon {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: var(--err);
    background: var(--err-soft);
  }
  .error-icon svg { width: 22px; height: 22px; }
  .error h2 {
    margin: 18px 0 8px;
    font-size: 22px;
    line-height: 1.3;
    letter-spacing: 0;
  }
  .error-copy {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .error-detail {
    max-height: 230px;
    margin: 18px 0 0;
    padding: 14px 15px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--fg);
    background: var(--bg);
    font: 12px/1.6 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  button.primary, button.ghost {
    min-height: 42px;
    padding: 0 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .15s ease, opacity .15s ease, background .15s ease;
  }
  button.primary {
    border: 0;
    color: #fff;
    background: var(--brand);
  }
  button.ghost {
    color: var(--fg);
    border: 1px solid var(--line);
    background: transparent;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:focus-visible {
    outline: 3px solid var(--brand-soft);
    outline-offset: 2px;
  }
  button:disabled { opacity: .55; cursor: default; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 560px) {
    body { padding: 24px 18px 64px; overflow: auto; }
    .mark { width: 64px; height: 64px; margin-bottom: 20px; border-radius: 16px; }
    h1 { font-size: 30px; }
    .error { padding: 22px; }
    .actions { flex-direction: column; }
    button.primary, button.ghost { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<main class="stage">
  <section class="welcome" id="welcome" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 4.7 12.6a.8.8 0 0 0 .64 1.3H11l-1 8.1 8.3-10.6a.8.8 0 0 0-.64-1.3H13l1-8.1Z" />
      </svg>
    </div>
    <h1>Codex SwitchGate</h1>
    <p class="tagline">本地模型热切换中转</p>

    <div class="status" id="status" data-state="loading" role="status" aria-label="正在启动">
      <span class="spinner" aria-hidden="true"></span>
    </div>
  </section>

  <section class="error" id="error" hidden aria-live="assertive">
    <div class="error-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 2.6 19.2a1.3 1.3 0 0 0 1.1 2h16.6a1.3 1.3 0 0 0 1.1-2L12 3Z" />
        <path d="M12 9v4.8" />
        <path d="M12 17.6h.01" />
      </svg>
    </div>
    <h2 id="error-title">启动失败</h2>
    <p class="error-copy" id="error-copy">下面是具体原因，可以复制给 Codex 继续排查。</p>
    <pre class="error-detail" id="error-detail"></pre>
    <div class="actions">
      <button class="primary" id="retry">重新启动</button>
      <button class="ghost" id="copy">复制错误信息</button>
    </div>
  </section>
</main>

<script>
const invoke = window.__TAURI__.core.invoke;
const el = (id) => document.getElementById(id);
const MIN_NODE = "22.5";

// GUI 外壳没有控制台，关键状态同时落盘到 logs/guide.log，便于事后排查。
function log(level, message) {
  try {
    invoke("guide_log", { level, message: String(message) }).catch(() => {});
  } catch (_) {}
}

function setStatus(state = "loading") {
  el("status").dataset.state = state;
  el("status").setAttribute(
    "aria-label",
    state === "ready" ? "启动完成" : state === "error" ? "启动失败" : "正在启动",
  );
}

function showWelcome() {
  el("error").hidden = true;
  el("welcome").hidden = false;
  setStatus();
}

function showError(title, detail) {
  log("ERROR", title + "\n" + detail);
  setStatus("error");
  el("error-title").textContent = title;
  el("error-detail").textContent = detail || "没有返回更多错误信息。";
  el("welcome").hidden = true;
  el("error").hidden = false;
  el("retry").disabled = false;
  el("retry").focus();
}

async function ensureNode() {
  const probe = await invoke("probe_node");
  if (!probe.supported) {
    throw new Error(
      "需要 Node " + MIN_NODE + " 或更高版本，当前为 " + probe.version + "。\n" +
      "Node 路径：" + probe.path + "\n\n" +
      "请升级 Node 后点击「重新启动」。\n" +
      "下载：https://nodejs.org/"
    );
  }
  log("INFO", "node ok " + probe.version + " @" + probe.path);
  return probe;
}

async function startService() {
  el("retry").disabled = true;
  showWelcome();

  try {
    await ensureNode();
    const started = await invoke("start_server", { options: {} });
    log("INFO", "start_server -> " + JSON.stringify(started));

    if (started.state === "running") {
      setStatus("ready");
      location.replace(started.endpoint);
      return;
    }

    // 最长等待 30 秒。子进程崩溃时 Rust 侧会返回 failed 和 stderr 尾部，
    // 这里立即展示原文，而不是继续转圈。
    for (let attempt = 0; attempt < 60; attempt += 1) {
      await new Promise((resolve) => setTimeout(resolve, 500));
      const status = await invoke("server_status");
      if (status.state === "failed") {
        throw new Error(status.message || "服务进程已退出。");
      }
      if (status.state === "running") {
        log("INFO", "ready, navigating to " + status.endpoint);
        setStatus("ready");
        location.replace(status.endpoint);
        return;
      }
    }
    throw new Error("等待 30 秒仍未就绪。\n\n常见原因：端口 8787 被占用，或 Node 环境不完整。");
  } catch (error) {
    const message = error instanceof Error ? error.message : String(error);
    let detail = message;
    try {
      const paths = await invoke("debug_paths");
      detail +=
        "\n\n路径信息：" +
        "\nresourceDir: " + (paths.resourceDir || "(null)") +
        "\nserverRoot: " + (paths.serverRoot || "(null)") +
        "\nserver.js 存在: " + paths.serverJsExists;
    } catch (_) {}
    showError("启动失败", detail);
  }
}

el("retry").addEventListener("click", startService);
el("copy").addEventListener("click", async () => {
  const text = el("error-detail").textContent || "";
  try {
    await navigator.clipboard.writeText(text);
    el("copy").textContent = "已复制";
    setTimeout(() => { el("copy").textContent = "复制错误信息"; }, 1600);
  } catch (_) {
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(el("error-detail"));
    selection.removeAllRanges();
    selection.addRange(range);
  }
});

(async () => {
  log("INFO", "guide page loaded");
  await startService();
})();
</script>
</body>
</html>
